name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, fileinfo, mbstring, openssl, zip
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check formatting
        run: >-
          vendor/bin/pint --test
          config/steadfast-courier.php
          src/Facades/SteadfastCourier.php
          src/SteadfastCourier.php
          tests/SteadfastCourierTest.php
          tests/TestCase.php

      - name: Run tests
        run: vendor/bin/pest
